# ==============================================================================
# SCRAP CONNECTION APPLICATION PROPERTIES
# ==============================================================================
spring.application.name=Scrap Connection
server.port=${PORT:10000}

# ------------------------------------------------------------------------------
# MySQL Database Configuration (Aiven Cloud & Local)
# ------------------------------------------------------------------------------
# Supports Render / standard Spring Boot env vars (SPRING_DATASOURCE_URL, DB_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/scrap_connection?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# Hibernate / JPA Settings (Safe schema management)
# ------------------------------------------------------------------------------
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ------------------------------------------------------------------------------
# CORS Configuration
# ------------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ------------------------------------------------------------------------------
# Thymeleaf & MVC
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ------------------------------------------------------------------------------
# Application Custom Settings
# ------------------------------------------------------------------------------
# Supports APP_SMS_MODE environment variable (development or production)
app.sms.mode=${APP_SMS_MODE:development}

# OTP Rules
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.rate-limit-minutes=10
app.otp.max-requests-per-window=3

# Loyalty Rewards Policy: 1 point earned per every ₹10 of completed scrap sale
app.loyalty.points-per-rupees=10

# Coupon Policy: Coupon validity in days
app.coupon.validity-days=90
